<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>waay to the TOP</title>
  <style>
    :root {
      --text-main: #d9b3ff;
      --stroke-black: #000000;
      --stroke-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      user-select: none;
      background:
        repeating-conic-gradient(
          from -8deg at 50% 50%,
          #ff1717 0deg 16deg,
          #ff8a00 16deg 32deg,
          #ffe600 32deg 48deg,
          #18d94f 48deg 64deg,
          #008cff 64deg 80deg
        );
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 30%, rgba(0,0,0,0.10) 70%, rgba(0,0,0,0.18) 100%);
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(92vw, 520px);
      padding: 30px 20px 34px;
    }

    .outlined {
      color: var(--text-main);
      -webkit-text-stroke: 2px var(--stroke-black);
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 var(--stroke-white),
         0px -3px 0 var(--stroke-white),
         3px -3px 0 var(--stroke-white),
        -3px  0px 0 var(--stroke-white),
         3px  0px 0 var(--stroke-white),
        -3px  3px 0 var(--stroke-white),
         0px  3px 0 var(--stroke-white),
         3px  3px 0 var(--stroke-white),
        -4px -4px 0 var(--stroke-white),
         0px -4px 0 var(--stroke-white),
         4px -4px 0 var(--stroke-white),
        -4px  0px 0 var(--stroke-white),
         4px  0px 0 var(--stroke-white),
        -4px  4px 0 var(--stroke-white),
         0px  4px 0 var(--stroke-white),
         4px  4px 0 var(--stroke-white),
         0px  6px 16px rgba(0,0,0,0.22);
      letter-spacing: 1px;
    }

    .title {
      font-size: clamp(34px, 9vw, 56px);
      font-weight: 900;
      line-height: 1.15;
      margin: 0;
    }

    .subtitle {
      font-size: clamp(28px, 7.4vw, 46px);
      font-weight: 900;
      line-height: 1.18;
      margin: 10px 0 0;
    }

    .hint {
      margin-top: 18px;
      font-size: clamp(16px, 4.3vw, 22px);
      font-weight: 800;
      line-height: 1.5;
    }

    .broadcast {
      margin-top: 10px;
      font-size: clamp(18px, 4.8vw, 24px);
      font-weight: 900;
      line-height: 1.5;
    }

    .countdown-label {
      margin-top: 20px;
      font-size: clamp(18px, 4.8vw, 25px);
      font-weight: 900;
      line-height: 1.4;
    }

    .countdown {
      margin-top: 10px;
      font-size: clamp(24px, 7vw, 42px);
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 1px;
      color: #f3dcff;
      -webkit-text-stroke: 2px var(--stroke-black);
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 var(--stroke-white),
         0px -3px 0 var(--stroke-white),
         3px -3px 0 var(--stroke-white),
        -3px  0px 0 var(--stroke-white),
         3px  0px 0 var(--stroke-white),
        -3px  3px 0 var(--stroke-white),
         0px  3px 0 var(--stroke-white),
         3px  3px 0 var(--stroke-white),
        -4px -4px 0 var(--stroke-white),
         0px -4px 0 var(--stroke-white),
         4px -4px 0 var(--stroke-white),
        -4px  0px 0 var(--stroke-white),
         4px  0px 0 var(--stroke-white),
        -4px  4px 0 var(--stroke-white),
         0px  4px 0 var(--stroke-white),
         4px  4px 0 var(--stroke-white),
         0px  6px 16px rgba(0,0,0,0.22);
    }

    .emoji-pop {
      position: fixed;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      font-size: clamp(28px, 7vw, 44px);
      pointer-events: none;
      z-index: 999;
      animation: floatEmoji 1200ms ease-out forwards;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.18));
      will-change: transform, opacity;
    }

    @keyframes floatEmoji {
      0% {
        opacity: 0;
        transform: translate(-50%, -10%) scale(0.5) rotate(-8deg);
      }

      12% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05) rotate(6deg);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -180%) scale(1.4) rotate(-12deg);
      }
    }

    @media (max-width: 480px) {
      .page {
        width: min(92vw, 420px);
        padding: 28px 16px 30px;
      }
    }
  </style>
</head>
<body>
  <main class="page" id="page">
    <h1 class="title outlined">登神降临</h1>
    <div class="subtitle outlined">全体一级戒备</div>

    <div class="hint outlined">（点击屏幕有惊喜）</div>
    <div class="broadcast outlined">登神经此处放送</div>

    <div class="countdown-label outlined">倒计时</div>
    <div class="countdown" id="countdown">加载中...</div>
  </main>

  <script>
    const emojis = ["😺", "🥭", "🐵", "🐷", "🍪"];

    function createEmoji(x, y) {
      const el = document.createElement("div");
      el.className = "emoji-pop";
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;

      const randomDuration = 950 + Math.floor(Math.random() * 450);
      el.style.animationDuration = `${randomDuration}ms`;

      document.body.appendChild(el);
      setTimeout(() => el.remove(), randomDuration + 100);
    }

    function handlePointer(event) {
      const x = event.clientX ?? (event.touches && event.touches[0]?.clientX) ?? window.innerWidth / 2;
      const y = event.clientY ?? (event.touches && event.touches[0]?.clientY) ?? window.innerHeight / 2;
      createEmoji(x, y);
    }

    document.body.addEventListener("click", handlePointer);
    document.body.addEventListener("touchstart", handlePointer, { passive: true });

    function updateCountdown() {
      const countdownEl = document.getElementById("countdown");

      const targetUtc = Date.UTC(2026, 4, 9, 9, 0, 0);
      const now = Date.now();
      const diff = targetUtc - now;

      if (diff <= 0) {
        countdownEl.textContent = "00天 00时 00分 00秒";
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const pad = (num) => String(num).padStart(2, "0");
      countdownEl.textContent = `${pad(days)}天 ${pad(hours)}时 ${pad(minutes)}分 ${pad(seconds)}秒`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
