<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>waay to the TOP</title>

  <style>
    :root {
      --text-main: #d9b3ff;
      --stroke-black: #000000;
      --stroke-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
      color: var(--text-main);
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background:
        repeating-conic-gradient(
          from -8deg at 50% 50%,
          #ff1717 0deg 16deg,
          #ff8a00 16deg 32deg,
          #ffe600 32deg 48deg,
          #18d94f 48deg 64deg,
          #008cff 64deg 80deg
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,0.08) 0%,
          rgba(255,255,255,0.02) 30%,
          rgba(0,0,0,0.08) 70%,
          rgba(0,0,0,0.16) 100%
        );
      pointer-events: none;
      z-index: 1;
    }

    .tap-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    .page {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100vw;
      min-height: 100svh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding:
        max(24px, env(safe-area-inset-top))
        18px
        max(24px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .content {
      width: min(92vw, 560px);
      transform: translateY(-1vh);
      isolation: isolate;
    }

    .stroke-text {
      position: relative;
      display: block;
      color: var(--text-main);
      -webkit-text-stroke: 2.2px var(--stroke-black);
      paint-order: stroke fill;
      line-height: 1.16;
      letter-spacing: 1px;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      text-shadow: 0 4px 10px rgba(0,0,0,0.18);
    }

    .stroke-text::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      z-index: -1;
      color: transparent;
      -webkit-text-stroke: 7px var(--stroke-white);
      paint-order: stroke fill;
      text-shadow: none;
      pointer-events: none;
    }

    .title {
      font-size: clamp(38px, 12vw, 64px);
      font-weight: 900;
      margin: 0;
    }

    .subtitle {
      font-size: clamp(31px, 9.8vw, 52px);
      font-weight: 900;
      margin-top: 10px;
    }

    .hint {
      font-size: clamp(18px, 5.4vw, 28px);
      font-weight: 900;
      margin-top: 20px;
      line-height: 1.35;
    }

    .broadcast {
      font-size: clamp(21px, 6vw, 32px);
      font-weight: 900;
      margin-top: 12px;
      line-height: 1.35;
    }

    .countdown-label {
      font-size: clamp(21px, 6vw, 32px);
      font-weight: 900;
      margin-top: 24px;
      line-height: 1.35;
    }

    .countdown {
      font-size: clamp(25px, 7.5vw, 44px);
      font-weight: 900;
      margin-top: 12px;
      line-height: 1.25;
      letter-spacing: 0.5px;
      color: #f1dbff;
      -webkit-text-stroke: 2px var(--stroke-black);
      white-space: nowrap;
    }

    .countdown::before {
      -webkit-text-stroke: 6.5px var(--stroke-white);
    }

    .emoji-pop {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 30;
      transform: translate(-50%, -50%);
      font-size: clamp(34px, 10vw, 58px);
      pointer-events: none;
      animation: floatEmoji 1150ms cubic-bezier(.16,.84,.34,1) forwards;
      will-change: transform, opacity;

      /*
        emoji 描边：
        第一圈白色描边，让表情从彩色背景里跳出来；
        第二层黑色阴影，加强边缘和立体感。
      */
      filter:
        drop-shadow(-1px -1px 0 #ffffff)
        drop-shadow(1px -1px 0 #ffffff)
        drop-shadow(-1px 1px 0 #ffffff)
        drop-shadow(1px 1px 0 #ffffff)
        drop-shadow(0 -2px 0 #ffffff)
        drop-shadow(0 2px 0 #ffffff)
        drop-shadow(-2px 0 0 #ffffff)
        drop-shadow(2px 0 0 #ffffff)
        drop-shadow(0 5px 7px rgba(0,0,0,0.38));
    }

    @keyframes floatEmoji {
      0% {
        opacity: 0;
        transform: translate(-50%, -35%) scale(0.45) rotate(-10deg);
      }

      14% {
        opacity: 1;
        transform: translate(-50%, -58%) scale(1.05) rotate(6deg);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -220%) scale(1.35) rotate(-14deg);
      }
    }

    @media (max-width: 430px) {
      .content {
        width: min(94vw, 420px);
      }

      .stroke-text {
        -webkit-text-stroke: 2px var(--stroke-black);
      }

      .stroke-text::before {
        -webkit-text-stroke: 6px var(--stroke-white);
      }

      .countdown {
        font-size: clamp(23px, 7vw, 34px);
      }

      .countdown::before {
        -webkit-text-stroke: 5.5px var(--stroke-white);
      }

      .emoji-pop {
        filter:
          drop-shadow(-1px -1px 0 #ffffff)
          drop-shadow(1px -1px 0 #ffffff)
          drop-shadow(-1px 1px 0 #ffffff)
          drop-shadow(1px 1px 0 #ffffff)
          drop-shadow(0 -2px 0 #ffffff)
          drop-shadow(0 2px 0 #ffffff)
          drop-shadow(-2px 0 0 #ffffff)
          drop-shadow(2px 0 0 #ffffff)
          drop-shadow(0 4px 6px rgba(0,0,0,0.40));
      }
    }

    @media (max-width: 360px) {
      .title {
        font-size: clamp(34px, 11vw, 46px);
      }

      .subtitle {
        font-size: clamp(28px, 9vw, 40px);
      }

      .hint {
        font-size: clamp(16px, 5vw, 22px);
      }

      .broadcast,
      .countdown-label {
        font-size: clamp(18px, 5.4vw, 24px);
      }

      .countdown {
        font-size: clamp(21px, 6.3vw, 29px);
        letter-spacing: 0;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content">
      <h1 class="title stroke-text" data-text="登神降临">登神降临</h1>
      <div class="subtitle stroke-text" data-text="全体一级戒备">全体一级戒备</div>

      <div class="hint stroke-text" data-text="（点击屏幕有惊喜）">（点击屏幕有惊喜）</div>
      <div class="broadcast stroke-text" data-text="登神经此处放送">登神经此处放送</div>

      <div class="countdown-label stroke-text" data-text="倒计时">倒计时</div>
      <div class="countdown stroke-text" id="countdown" data-text="加载中...">加载中...</div>
    </section>
  </main>

  <div class="tap-layer" id="tapLayer" aria-label="点击屏幕触发表情"></div>

  <script>
    const emojis = ["😺", "🥭", "🐵", "🐷", "🫓"];
    const tapLayer = document.getElementById("tapLayer");

    function createEmoji(x, y) {
      const el = document.createElement("div");
      el.className = "emoji-pop";
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];

      const randomX = Math.random() * 18 - 9;
      const randomY = Math.random() * 8 - 4;
      const randomDuration = 950 + Math.floor(Math.random() * 420);
      const randomSize = 0.88 + Math.random() * 0.36;

      el.style.left = `${x + randomX}px`;
      el.style.top = `${y + randomY}px`;
      el.style.animationDuration = `${randomDuration}ms`;
      el.style.fontSize = `calc(clamp(34px, 10vw, 58px) * ${randomSize})`;

      document.body.appendChild(el);

      window.setTimeout(() => {
        el.remove();
      }, randomDuration + 120);
    }

    tapLayer.addEventListener("pointerdown", function(event) {
      createEmoji(event.clientX, event.clientY);
    });

    function updateCountdown() {
      const countdownEl = document.getElementById("countdown");

      /*
        目标时间：北京时间 2026-05-09 17:00:00
        北京时间是 UTC+8，所以对应 UTC 时间是 2026-05-09 09:00:00
        JavaScript 月份从 0 开始，因此 4 代表 5 月。
      */
      const targetUtc = Date.UTC(2026, 4, 9, 9, 0, 0);
      const now = Date.now();
      const diff = targetUtc - now;

      if (diff <= 0) {
        countdownEl.textContent = "00天 00时 00分 00秒";
        countdownEl.setAttribute("data-text", "00天 00时 00分 00秒");
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const pad = (num) => String(num).padStart(2, "0");
      const result = `${pad(days)}天 ${pad(hours)}时 ${pad(minutes)}分 ${pad(seconds)}秒`;

      countdownEl.textContent = result;
      countdownEl.setAttribute("data-text", result);
    }

    updateCountdown();
    window.setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
